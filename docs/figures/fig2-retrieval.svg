<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1100" height="400" fill="#ffffff"/>
<rect x="30" y="150" width="170" height="100" rx="7" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="46" y="178" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >natural-language</text>
<text x="46" y="200" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >query</text>
<rect x="250" y="40" width="330" height="150" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="266" y="68" font-size="13" fill="#59636e" text-anchor="start" font-weight="700" letter-spacing="1">KEYWORD RETRIEVER</text>
<text x="266" y="94" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >ILIKE on every term (up to 8)</text>
<text x="266" y="116" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >ordered by recency</text>
<text x="266" y="138" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >top 100 candidates</text>
<rect x="250" y="220" width="330" height="140" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="266" y="248" font-size="13" fill="#59636e" text-anchor="start" font-weight="700" letter-spacing="1">SEMANTIC RETRIEVER</text>
<text x="266" y="274" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >embed query (voyage-4, cached)</text>
<text x="266" y="296" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >cosine distance, top 100</text>
<text x="266" y="318" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >keep if sim &gt;= max(0.36, best - 0.18)</text>
<rect x="650" y="130" width="230" height="140" rx="7" fill="#ffffff" stroke="#8c2d2d" stroke-width="1.4"/>
<text x="666" y="158" font-size="13" fill="#59636e" text-anchor="start" font-weight="700" letter-spacing="1">RECIPROCAL RANK FUSION</text>
<text x="666" y="184" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >score(d) = sum over</text>
<text x="666" y="206" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >retrievers of</text>
<text x="666" y="228" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >1 / (60 + rank(d))</text>
<rect x="940" y="150" width="140" height="100" rx="7" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="956" y="178" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >ranked hits +</text>
<text x="956" y="200" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400" >matched_by</text>
